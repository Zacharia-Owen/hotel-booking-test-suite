name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotel_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_NAME: hotel_booking
      DB_PORT: 5432

    steps:
      - name: Check out the test suite (this repo)
        uses: actions/checkout@v4

      - name: Check out the app (Hotel-Booking-Platform)
        uses: actions/checkout@v4
        with:
          repository: Zacharia-Owen/Hotel-Booking-Platform
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Seed the database
        run: psql -h localhost -U postgres -d hotel_booking -f app/seed.sql
        env:
          PGPASSWORD: postgres

      - name: Install and start the backend(port 5000)
        working-directory: app/backend
        run: |
          npm ci
          nohup npx ts-node src/index.ts > ../backend.log 2>&1 &

      - name: Install and start the frontend(port 5173)
        working-directory: app/frontend
        run: |
          npm ci
          nohup npm run dev > ../frontend.log 2>&1 &

      - name: Wait for both servers to respond
        run: |
          for url in http://localhost:5000/api/rooms http://localhost:5173; do
            for i in $(seq 1 30); do
              if curl -sf "$url" > /dev/null; then echo "$url is up"; break; fi
              if [ "$i" = 30 ]; then
                echo "$url never came up"
                echo "--- backend.log ---";  cat app/backend.log
                echo "--- frontend.log ---"; cat app/frontend.log
                exit 1
              fi
              sleep 2
            done
          done

      - name: Install test suite dependencies
        run: npm ci
 
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
 
      - name: Run Playwright tests
        run: npx playwright test --grep-invert "Visual Regression"
 
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
 
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            app/backend.log
            app/frontend.log
 
